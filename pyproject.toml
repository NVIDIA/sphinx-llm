[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sphinx-llm"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = []
authors = [{ name = "Jacob Tomlinson", email = "jacob@tomlinson.email" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "docutils>=0.14",
    # MyST 1.x needs markdown-it-py 2.x for documentation builds on Sphinx 5.
    "markdown-it-py>=2.2",
    "sphinx-markdown-builder>=0.6.8",
    "sphinx>=5.1",
]

[project.optional-dependencies]
docs = ["myst-parser>=1"]
gen = ["openai>=1.55.3"]

[dependency-groups]
docs = ["nvidia-sphinx-theme>=0.0.9.post1"]
dev = [
    "coverage>=7.10",
    "llms-txt==0.0.6; python_version >= '3.10'",
    "myst-parser>=1",
    "pytest>=8.4.1",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.8",
    "sphinx-autobuild>=2024.10.3",
]

[project.urls]
Documentation = "https://github.com/NVIDIA/sphinx-llm#readme"
Issues = "https://github.com/NVIDIA/sphinx-llm/issues"
Source = "https://github.com/NVIDIA/sphinx-llm"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/sphinx_llm/_version.py"

[tool.hatch.envs.types]
extra-dependencies = ["mypy>=1.0.0"]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/sphinx_llm tests}"

[tool.coverage.run]
source_pkgs = ["sphinx_llm"]
branch = true
parallel = true
# Measure the sphinx-build subprocesses that render Markdown.
patch = ["subprocess"]
omit = ["*/sphinx_llm/tests/*"]

[tool.coverage.paths]
sphinx_llm = ["src/sphinx_llm", "*/sphinx-llm/src/sphinx_llm"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  # myst-parser reads SphinxTransform.app, deprecated in Sphinx 9. No category so
  # this still matches when RemovedInSphinx11Warning becomes a DeprecationWarning.
  "ignore:'myst_parser\\.sphinx_ext\\.myst_refs\\.MystReferenceResolver\\.app' is deprecated::myst_parser\\.sphinx_ext\\.myst_refs",
  # Sphinx forks for parallel reading; under pytest-xdist the worker already
  # runs execnet threads, so Python >=3.12 warns about fork() with threads.
  "ignore:This process .* is multi-threaded, use of fork\\(\\) may lead to deadlocks:DeprecationWarning:multiprocessing\\.popen_fork",
  # Sphinx <7 uses stdlib APIs that Python 3.12 deprecates.
  "ignore:'imghdr' is deprecated:DeprecationWarning:sphinx\\.util\\.images",
  "ignore:datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning:sphinx\\.",
]

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.isort]
known-first-party = ["sphinx_llm"]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.10" }
