name: llms.txt reference parser

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  reference-parser:
    name: Build and parse
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.11"
          python-version: "3.12"
          enable-cache: false

      - name: Build docs and parse llms.txt
        env:
          SPHINX_LLM_BUILD_DIR: ${{ runner.temp }}/sphinx-llm-html
        run: |
          uv run --frozen --dev sphinx-build -W \
            docs/source "$SPHINX_LLM_BUILD_DIR"
          uv run --frozen --dev python -c \
            'import os; from pathlib import Path; from llms_txt import parse_llms_file; parsed = parse_llms_file(Path(os.environ["SPHINX_LLM_BUILD_DIR"], "llms.txt").read_text(encoding="utf-8")); assert parsed.title'
