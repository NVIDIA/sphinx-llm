name: Update release draft

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update-release-draft:
    if: github.repository == 'NVIDIA/sphinx-llm'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # release-drafter/release-drafter v6.4.0
      # https://github.com/release-drafter/release-drafter/releases/tag/v6.4.0
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7
        with:
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
