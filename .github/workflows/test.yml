name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Test each Sphinx version against latest Python
          - python-version: "3.12"
            sphinx-version: ">=5.1,<6"
          - python-version: "3.12"
            sphinx-version: ">=6,<7"
          - python-version: "3.12"
            sphinx-version: ">=7,<8"
          - python-version: "3.12"
            sphinx-version: ">=8,<9"
          - python-version: "3.12"
            sphinx-version: ">=9,<10"
          # Test each remaining Python version against its latest compatible Sphinx
          - python-version: "3.9"
            sphinx-version: ">=7,<8"
          - python-version: "3.10"
            sphinx-version: ">=7,<8"
          - python-version: "3.11"
            sphinx-version: ">=8,<9"
          - python-version: "3.13"
            sphinx-version: ">=9,<10"
          - python-version: "3.14"
            sphinx-version: ">=9,<10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --dev --extra gen --with "sphinx${{ matrix.sphinx-version }}" pytest src/sphinx_llm/tests/ --cov=sphinx_llm --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-without-generation-extra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          python-version: "3.12"

      - name: Run tests without generation dependencies
        run: uv run --dev --no-extra gen pytest src/sphinx_llm/tests/
