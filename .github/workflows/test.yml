name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-mindeps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          python-version: "3.9"

      - name: Run tests with lowest supported direct dependency versions
        run: uv run --resolution lowest-direct --dev --extra gen pytest -n 4 --dist worksteal src/sphinx_llm/tests/

  test:
    # Keep this image label in both cache keys below when upgrading the runner.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          # Test each Sphinx version against latest Python
          - python-version: "3.12"
            sphinx-version: ">=5.1,<6"
          - python-version: "3.12"
            sphinx-version: ">=6,<7"
          - python-version: "3.12"
            sphinx-version: ">=7,<8"
          - python-version: "3.12"
            sphinx-version: ">=8,<9"
          - python-version: "3.12"
            sphinx-version: ">=9,<10"
          # Test each remaining Python version against its latest compatible Sphinx
          - python-version: "3.11"
            sphinx-version: ">=9,<10"
          - python-version: "3.13"
            sphinx-version: ">=9,<10"
          - python-version: "3.14"
            sphinx-version: ">=9,<10"
          - python-version: "3.15"
            sphinx-version: ">=9,<10"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
          cache-local-path: ${{ runner.temp }}/uv-cache

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-cache
          # Matrix indices isolate Sphinx rows without commas in cache keys.
          key: uv-ubuntu-24.04-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ strategy.job-index }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          # Reuse unchanged source-built wheels after dependency updates.
          restore-keys: |
            uv-ubuntu-24.04-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ strategy.job-index }}-

      - name: Run tests
        run: uv run --dev --extra gen --with "sphinx${{ matrix.sphinx-version }}" pytest -n 4 --dist worksteal src/sphinx_llm/tests/ --cov=sphinx_llm --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
