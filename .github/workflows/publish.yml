name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tagged revision
        # actions/checkout v7.0.1
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify annotated tag is on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git cat-file -e "refs/tags/${RELEASE_TAG}^{tag}"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  publish-release:
    name: Publish GitHub release
    needs: validate-release-tag
    if: github.repository == 'NVIDIA/sphinx-llm'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # release-drafter/release-drafter v6.4.0
      # https://github.com/release-drafter/release-drafter/releases/tag/v6.4.0
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7
        with:
          disable-autolabeler: true
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Build and publish to PyPI
    needs: validate-release-tag
    if: github.repository == 'NVIDIA/sphinx-llm'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for trusted publishing

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # Required for hatch-vcs to determine version from tags

      - name: Install uv
        # astral-sh/setup-uv v9.0.0
        # https://github.com/astral-sh/setup-uv/releases/tag/v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Validate distributions
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"

      - name: Publish distribution to PyPI
        # pypa/gh-action-pypi-publish v1.14.2
        # https://github.com/pypa/gh-action-pypi-publish/releases/tag/v1.14.2
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26
        with:
          packages-dir: dist/
