name: Build Sphinx Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        sphinx-version: [">=5.1,<6", ">=6,<7", ">=7,<8", ">=8,<9", ">=9,<10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Ollama
        uses: ai-action/setup-ollama@fc020bb65890f31d60475232b35cea07152316ee # v2.0.9
        with:
          version: 0.32.5

      - name: Pull documentation model
        run: ollama pull qwen3.5:2b

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Test OpenAI-compatible generation
        if: matrix.sphinx-version == '>=7,<8'
        env:
          OPENAI_MODEL: qwen3.5:2b
          OPENAI_BASE_URL: http://localhost:11434/v1
          OPENAI_REASONING_EFFORT: none
          SPHINX_LLM_LIVE_TEST: "1"
        run: |
          uv run --dev --extra gen --with "sphinx${{ matrix.sphinx-version }}" pytest -q src/sphinx_llm/tests/test_summary.py::test_summarize_text_with_live_endpoint

      - name: Invalidate summary cache
        run: |
          echo "\n\nBuild ID: $GITHUB_RUN_ID" >> docs/source/apples.rst
          cp docs/source/test.rst docs/source/test.rst.bak

      - name: Build Sphinx documentation
        env:
          OPENAI_BASE_URL: http://localhost:11434/v1
        run: |
          uv run --dev --extra gen --with "sphinx${{ matrix.sphinx-version }}" sphinx-build -D llms_txt_build_parallel=0 -b html docs/source docs/build/html

      - name: DEBUG Output updated source file
        run: |
          diff docs/source/test.rst docs/source/test.rst.bak || true
