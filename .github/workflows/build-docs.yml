name: Build Sphinx Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        sphinx-version: [">=5.1,<6", ">=6,<7", ">=7,<8", ">=8,<9", ">=9,<10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Ollama
        uses: ai-action/setup-ollama@fc020bb65890f31d60475232b35cea07152316ee # v2.0.9
        env:
          OLLAMA_DEBUG_LOG_REQUESTS: "1"
        with:
          version: 0.32.5

      - name: Pull documentation model
        run: ollama pull qwen3.5:2b

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Invalidate summary cache
        run: |
          echo "\n\nBuild ID: $GITHUB_RUN_ID" >> docs/source/apples.rst
          cp docs/source/test.rst docs/source/test.rst.bak

      - name: Build Sphinx documentation
        env:
          OPENAI_MODEL: qwen3.5:2b
          OPENAI_BASE_URL: http://localhost:11434/v1
        run: |
          uv run --dev --extra gen --with "sphinx${{ matrix.sphinx-version }}" sphinx-build -D llms_txt_build_parallel=0 -b html docs/source docs/build/html

      - name: Verify generated summary updated source hash
        run: |
          original_hash="$(sed -n 's/^   :hash: //p' docs/source/test.rst.bak)"
          generated_hash="$(sed -n 's/^   :hash: //p' docs/source/test.rst)"
          test -n "$original_hash"
          test -n "$generated_hash"
          test "$original_hash" != "$generated_hash"

      - name: Show Ollama generation logs
        if: ${{ always() }}
        run: |
          echo "::group::Ollama generation request"
          request_logs=(/tmp/ollama-request-logs-*/*_v1_chat_completions_body.json)
          if [[ -e "${request_logs[0]}" ]]; then
            for request_log in "${request_logs[@]}"; do
              echo "Request log: $request_log"
              cat "$request_log"
            done
          else
            echo "No Ollama generation request log found."
          fi
          echo "::endgroup::"

          echo "::group::Generated summary"
          if [[ -f docs/source/test.rst.bak && -f docs/source/test.rst ]]; then
            if cmp -s docs/source/test.rst.bak docs/source/test.rst; then
              echo "No generated summary change found."
            else
              diff --unified=0 docs/source/test.rst.bak docs/source/test.rst || true
            fi
          else
            echo "Generated summary files are unavailable."
          fi
          echo "::endgroup::"
