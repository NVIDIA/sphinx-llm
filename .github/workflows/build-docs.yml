name: Build Sphinx Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        sphinx-version: [">=5.1,<6", ">=6,<7", ">=7,<8", ">=8,<9", ">=9,<10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Ollama
        uses: ai-action/setup-ollama@fc020bb65890f31d60475232b35cea07152316ee # v2.0.9
        env:
          OLLAMA_DEBUG_LOG_REQUESTS: "1"
        with:
          version: 0.32.5

      - name: Pull documentation model
        run: ollama pull qwen3.5:2b

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Prepare generation smoke test
        run: |
          printf "\n\nBuild ID: %s\n" "$GITHUB_RUN_ID" >> docs/source/apples.rst
          find docs/source -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/docs-source-before-build.sha256

      - name: Build Sphinx documentation
        env:
          SPHINX_LLM_SUMMARY_MODEL: qwen3.5:2b
          SPHINX_LLM_SUMMARY_BASE_URL: http://localhost:11434/v1
          SPHINX_LLM_SUMMARY_API_KEY_ENV: ""
        run: |
          uv run --dev --extra gen --with "sphinx${{ matrix.sphinx-version }}" sphinx-build -D llms_txt_build_parallel=0 -D llms_txt_summary_enabled=1 -b html docs/source docs/build/html

      - name: Verify sources and generated summary report
        run: |
          find docs/source -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/docs-source-after-build.sha256
          cmp /tmp/docs-source-before-build.sha256 /tmp/docs-source-after-build.sha256
          jq -e '.summaries | any(.target == "apples" and .origin == "generated" and (.summary | length > 0) and (.fingerprint | length == 64))' docs/build/html/sphinx-llm-summaries.json

      - name: Show Ollama generation logs
        if: ${{ always() }}
        run: |
          echo "::group::Ollama generation request"
          request_logs=(/tmp/ollama-request-logs-*/*_v1_chat_completions_body.json)
          if [[ -e "${request_logs[0]}" ]]; then
            for request_log in "${request_logs[@]}"; do
              echo "Request log: $request_log"
              cat "$request_log"
            done
          else
            echo "No Ollama generation request log found."
          fi
          echo "::endgroup::"

          echo "::group::Generated summary report"
          if [[ -f docs/build/html/sphinx-llm-summaries.json ]]; then
            jq . docs/build/html/sphinx-llm-summaries.json
          else
            echo "Generated summary report is unavailable."
          fi
          echo "::endgroup::"
