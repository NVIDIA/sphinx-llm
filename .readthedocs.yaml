version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_install:
      - python -m pip install "pip>=25.1"
      - python -m pip install --group docs

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: pip
      path: .
